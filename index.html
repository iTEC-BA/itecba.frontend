<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport & Mobile ──────────────────────────────────────────── -->
    <!-- viewport-fit=cover es CRÍTICO para que la app se extienda detrás
         del notch y la Dynamic Island en iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── PWA Meta Tags ──────────────────────────────────────────────── -->
    <meta name="theme-color" content="#1A1A1A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: el status bar de iPhone se superpone al contenido
         con fondo transparente — le da el look nativo con tema oscuro -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iTEC BA" />
    <meta name="application-name" content="iTEC BA" />
    <meta name="msapplication-TileColor" content="#1A1A1A" />
    <meta name="msapplication-TileImage" content="/icons/pwa-192.png" />

    <!-- ── SEO ────────────────────────────────────────────────────────── -->
    <meta name="description" content="La plataforma estudiantil de la UTN Buenos Aires. Cursos, recursos, grupos y más." />
    <meta name="keywords" content="UTN, FRBA, iTEC, estudiantes, cursos, recursos, campus" />
    <meta name="author" content="iTEC BA" />

    <!-- ── Open Graph (preview en WhatsApp, Telegram, etc.) ──────────── -->
    <meta property="og:title" content="iTEC BA — UTN FRBA" />
    <meta property="og:description" content="La plataforma estudiantil de la UTN Buenos Aires." />
    <meta property="og:image" content="/icons/pwa-512.png" />
    <meta property="og:type" content="website" />

    <!-- ── Icons ──────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/png" sizes="64x64"   href="/icons/pwa-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-192.png" />
    <!-- apple-touch-icon: ícono que se usa en la pantalla de inicio de iOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- ── Safe area variables ────────────────────────────────────────── -->
    <!--
      IMPORTANTE: El padding de safe-area NO va en el body.
      Si lo ponés en body, empuja todo el contenido y genera espacios
      en blanco extraños. En cambio, exponemos las variables CSS y
      cada componente (TopNavbar, BottomNavbar, etc.) las usa donde corresponde.

      Uso en componentes:
        padding-top: env(safe-area-inset-top)      → TopNavbar
        padding-bottom: env(safe-area-inset-bottom) → BottomNavbar / contenido final
        padding-left: env(safe-area-inset-left)    → layout raíz en landscape
        padding-right: env(safe-area-inset-right)  → layout raíz en landscape
    -->
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }

      /* Reset base para PWA */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body, #root {
        height: 100%;
        /* NO poner overflow: hidden acá — rompe el scroll en iOS */
        overscroll-behavior: none; /* Evita el bounce blanco en iOS al hacer pull */
      }

      /* Elimina el highlight azul/gris al tocar en móvil */
      * {
        -webkit-tap-highlight-color: transparent;
      }

      /* Evita zoom automático en inputs en iOS (requiere font-size >= 16px) */
      input, select, textarea {
        font-size: max(16px, 1em);
      }
    </style>

    <title>iTEC BA — UTN FRBA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
